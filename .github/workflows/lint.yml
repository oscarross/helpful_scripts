name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install python script dependencies
        run: pip install -r images_downloader/requirements.txt
      # Static lint can't catch a broken flag or a runtime syntax slip.
      # -h short-circuits before any external tool (imagemagick, ffmpeg,
      # xcrun...) is required, so this runs on a bare runner.
      - name: Run --help on every script that has a CLI
        run: |
          set -euo pipefail
          for script in \
            git_delete_old_branches_local_and_remote/git_delete_old_branches_local_and_remote.sh \
            images_diff/images_diff.sh \
            images_merger/images_merger.sh \
            images_resizer/images_resizer.sh \
            ios_record_simulator/ios_record_simulator.sh \
            video_to_gif/video_to_gif.sh; do
            echo "::group::$script -h"
            bash "$script" -h
            echo "::endgroup::"
          done
          for script in \
            images_downloader/image_downloader.py \
            remove_special_characters/remove_special_chars.py; do
            echo "::group::$script -h"
            python3 "$script" -h
            echo "::endgroup::"
          done
